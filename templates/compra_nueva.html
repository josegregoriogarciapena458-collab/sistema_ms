{% extends 'base.html' %}{% block cuerpo %}<h1>Registrar compra</h1>
{% if not provs %}<div class="card">Primero registre un proveedor en la sección <a href="{{ url_for('proveedores') }}">Proveedores</a>.</div>{% else %}
<form method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf }}">
<div class="fila"><div><label>Proveedor *</label><select name="id_proveedor">{% for p in provs %}<option value="{{ p.id_proveedor }}">{{ p.nombre }}</option>{% endfor %}</select></div></div>
<h2>Productos e insumos comprados</h2><table id="t"><tr><th>Producto</th><th style="width:110px">Cantidad</th><th style="width:130px">Costo unitario</th><th class="n" style="width:110px">Subtotal</th><th style="width:40px"></th></tr></table>
<p><button type="button" class="btn sec" onclick="add()">+ Agregar</button></p><div class="total">Total: <span id="tot">$0.00</span></div>
<button class="btn">Registrar compra</button> <a class="btn sec" href="{{ url_for('compras') }}">Cancelar</a></form>
<script>
const P={{ prods|map(attribute='id_producto')|list|tojson }};
const D={ {% for p in prods %}"{{ p.id_producto }}":{n:{{ p.nombre|tojson }},c:{{ p.costo }},u:{{ p.unidad_medida|tojson }}},{% endfor %} };
function add(){const r=document.getElementById('t').insertRow();
 r.innerHTML='<td><select name="id_producto" onchange="sel(this)"><option value="">— elegir —</option>'+P.map(i=>`<option value="${i}">${D[i].n} (${D[i].u})</option>`).join('')+'</select></td><td><input name="cantidad" type="number" step="0.01" min="0.01" value="1" oninput="calc()"></td><td><input name="costo" type="number" step="0.01" min="0" value="0" oninput="calc()"></td><td class="n sb">$0.00</td><td><button type="button" class="btn rojo peq" onclick="this.closest(\'tr\').remove();calc()">×</button></td>';}
function sel(s){const r=s.closest('tr');if(s.value)r.querySelector('[name=costo]').value=D[s.value].c;calc();}
function calc(){let t=0;document.querySelectorAll('#t tr').forEach((r,i)=>{if(!i)return;const q=parseFloat(r.querySelector('[name=cantidad]').value)||0,c=parseFloat(r.querySelector('[name=costo]').value)||0;
 r.querySelector('.sb').textContent='$'+(q*c).toFixed(2);t+=q*c;});document.getElementById('tot').textContent='$'+t.toFixed(2);}
add();
</script>{% endif %}{% endblock %}
