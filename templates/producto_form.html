{% extends 'base.html' %}{% block cuerpo %}<h1>{{ 'Nuevo producto' if nuevo else 'Editar producto' }}</h1>
<form method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf }}">
<div class="fila"><div><label>Código *</label><input name="codigo" value="{{ p.codigo or '' }}" required></div><div><label>Nombre *</label><input name="nombre" value="{{ p.nombre or '' }}" required></div>
<div><label>Categoría *</label><select name="id_categoria" required>{% for c in cats %}<option value="{{ c.id_categoria }}" {{ 'selected' if p.id_categoria|string==c.id_categoria|string }}>{{ c.nombre }}</option>{% endfor %}</select></div>
<div><label>Tipo *</label><select name="tipo"><option value="PRODUCTO" {{ 'selected' if p.tipo=='PRODUCTO' }}>Producto (se vende)</option><option value="INSUMO" {{ 'selected' if p.tipo=='INSUMO' }}>Insumo (materia prima)</option></select></div>
<div><label>Unidad de medida *</label><input name="unidad_medida" value="{{ p.unidad_medida or '' }}" placeholder="unidad, kg, vaso…" required></div>
<div><label>Precio de venta (USD)</label><input name="precio_venta" type="number" step="0.01" min="0" value="{{ p.precio_venta or 0 }}"></div>
<div><label>Costo (USD)</label><input name="costo" type="number" step="0.01" min="0" value="{{ p.costo or 0 }}"></div>
<div><label>Existencia mínima</label><input name="stock_minimo" type="number" step="0.01" min="0" value="{{ p.stock_minimo or 0 }}"></div>
{% if nuevo %}<div><label>Existencia inicial</label><input name="stock_inicial" type="number" step="0.01" min="0" value="{{ p.stock_inicial or 0 }}"></div>{% endif %}</div>
<p><button class="btn">Guardar</button> <a class="btn sec" href="{{ url_for('productos') }}">Cancelar</a></p></form>{% endblock %}
