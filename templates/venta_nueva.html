{% extends 'base.html' %}{% block cuerpo %}<h1>Registrar venta</h1>
<form method="post" class="card" id="f"><input type="hidden" name="csrf" value="{{ csrf }}">
<div class="fila"><div><label>Cliente (opcional)</label><select name="id_cliente"><option value="">Consumidor final</option>{% for c in clientes %}<option value="{{ c.id_cliente }}">{{ c.nombre }}</option>{% endfor %}</select></div>
<div><label>Método de pago *</label><select name="metodo_pago">{% for m in METODOS %}<option>{{ m }}</option>{% endfor %}</select></div></div>
<h2>Productos</h2><table id="t"><tr><th>Producto</th><th style="width:110px">Cantidad</th><th class="n" style="width:100px">Precio</th><th class="n" style="width:110px">Subtotal</th><th style="width:40px"></th></tr></table>
<p><button type="button" class="btn sec" onclick="add()">+ Agregar producto</button></p><div class="total">Total: <span id="tot">$0.00</span></div>
<button class="btn">Registrar venta</button> <a class="btn sec" href="{{ url_for('ventas') }}">Cancelar</a></form>
<script>
const P={{ prods|map(attribute='id_producto')|list|tojson }};
const D={ {% for p in prods %}"{{ p.id_producto }}":{n:{{ p.nombre|tojson }},pr:{{ p.precio_venta }},st:{{ p.stock_actual }},u:{{ p.unidad_medida|tojson }}},{% endfor %} };
function add(){const r=document.getElementById('t').insertRow();
 r.innerHTML='<td><select name="id_producto" onchange="calc()"><option value="">— elegir —</option>'+P.map(i=>`<option value="${i}" ${D[i].st<=0?'disabled':''}>${D[i].n} (disp. ${D[i].st} ${D[i].u})</option>`).join('')+'</select></td><td><input name="cantidad" type="number" step="0.01" min="0.01" value="1" oninput="calc()"></td><td class="n pr">$0.00</td><td class="n sb">$0.00</td><td><button type="button" class="btn rojo peq" onclick="this.closest(\'tr\').remove();calc()">×</button></td>';}
function calc(){let t=0;document.querySelectorAll('#t tr').forEach((r,i)=>{if(!i)return;const id=r.querySelector('select').value,q=parseFloat(r.querySelector('input').value)||0;
 const pr=id?D[id].pr:0;r.querySelector('.pr').textContent='$'+pr.toFixed(2);const s=pr*q;r.querySelector('.sb').textContent='$'+s.toFixed(2);t+=s;});document.getElementById('tot').textContent='$'+t.toFixed(2);}
add();
</script>{% endblock %}
